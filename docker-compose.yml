version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: listacompras-db
    environment:
      POSTGRES_DB: listacompras
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - listacompras-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: listacompras-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/listacompras
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - listacompras-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: listacompras-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - listacompras-network

volumes:
  postgres_data:

networks:
  listacompras-network:
    driver: bridge
